[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nutshell-summarizer"
version = "0.1.0"
description = "Summarizes a story into a nutshell."
requires-python = ">=3.11"
dependencies = [
    "aws-opentelemetry-distro",
    "bedrock-agentcore >= 1.9.1",
    "botocore[crt] >= 1.35.0",
    "strands-agents >= 1.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["nutshell_summarizer"]
